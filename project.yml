name: FlashLAN
options:
  bundleIdPrefix: com.flashlan
  deploymentTarget:
    iOS: '16.0'
packages:
  KSPlayer:
    url: https://github.com/kingslay/KSPlayer.git
    exactVersion: 2.3.4
  FFmpegKit:
    url: https://github.com/kingslay/FFmpegKit.git
    exactVersion: 6.1.3
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.6.0
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  FlashLAN:
    type: application
    platform: iOS
    sources:
      - path: iOS/FlashLAN
        excludes: [Info.plist]
    dependencies:
      - package: SwiftSoup
      - package: KSPlayer
      - package: FFmpegKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flashlan.transfer
        INFOPLIST_FILE: iOS/FlashLAN/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.4.0'
        CURRENT_PROJECT_VERSION: '6'
        SUPPORTS_MACCATALYST: NO
  FlashLANTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: FlashLAN
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FlashLAN:
    build:
      targets:
        FlashLAN: all
        FlashLANTests: [test]
    test:
      targets: [FlashLANTests]
